plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mzj.pdftoimage'
    compileSdk 34

    defaultConfig {
        applicationId "com.mzj.pdftoimage"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('KS_FILE') ?: 'none')
            storePassword project.findProperty('KS_PASS') ?: ''
            keyAlias project.findProperty('K_ALIAS') ?: ''
            keyPassword project.findProperty('K_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('KS_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
